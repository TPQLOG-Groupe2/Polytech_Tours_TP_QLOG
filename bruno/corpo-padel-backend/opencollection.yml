opencollection: 1.0.0

info:
  name: corpo-padel-backend
  version: 1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    # Corpo padel backend's API helper

    ## How to use authenticated endpoints

    Before running an authenticated request, run `/auth/login` endpoint. It will set `token` variable automatically for all other requests.

    Running Logout endpoint will empty this `token` variable.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    openapi:
      - sourceUrl: http://localhost:8000/openapi.json
        groupBy: tags
        lastSyncDate: 2026-11-16T07:53:57.265Z
        specHash: bf3786e350cfd72d97e033ce058279e9
        autoCheck: true
        autoCheckInterval: 5
